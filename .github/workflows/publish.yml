name: Publish

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (ubuntu-latest / Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 errors out if the
      # version is declared both here and as `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches packages/cli/package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
          echo "Tag and package agree on $pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Structural tests
        run: pnpm -r --if-present run test:structural

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 errors out if the
      # version is declared both here and as `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Publishing a version that already exists is a hard error, which would
      # make tagging an already-released version fail the workflow. Skip.
      - name: Skip if this version is already on npm
        id: published
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "kiro-kit@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "kiro-kit@$version is already published — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No token anywhere: authentication is the OIDC identity GitHub mints for
      # this workflow, registered as a trusted publisher on npmjs.com. The
      # trusted publisher config pins this filename, so renaming this file
      # breaks publishing until npm is updated to match.
      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
        working-directory: packages/cli
